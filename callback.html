<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization — Gereksiz Bilge</title>
<style>
  :root { --bg:#ffffff; --fg:#1e293b; --muted:#64748b; --accent:#0f172a;
          --line:#e2e8f0; --card:#f8fafc; --ok:#059669; --err:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --accent:#facc15;
            --line:#1e293b; --card:#1e293b; --ok:#34d399; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:3.5rem 1.25rem; background:var(--bg); color:var(--fg);
         font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 38rem; margin: 0 auto; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; }
  p { color: var(--muted); }
  #code { width:100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size:.9rem; padding:1rem; margin-top:1.5rem; background:var(--card);
          color:var(--fg); border:1px solid var(--line); border-radius:8px;
          word-break:break-all; min-height:3.5rem; }
  button { margin-top:1rem; padding:.7rem 1.3rem; font-size:1rem; cursor:pointer;
           background:var(--accent); color:var(--bg); border:0; border-radius:8px;
           font-weight:600; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  .hint { margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--line);
          font-size:.92rem; }
</style>
</head>
<body>
<main>
  <h1 id="baslik">Reading authorization…</h1>
  <p id="aciklama">Yetkilendirme okunuyor…</p>
  <div id="code"></div>
  <button id="kopyala" hidden>Copy / Kopyala</button>
  <div class="hint" id="hint" hidden>
    Paste this code back into the terminal where
    <code>authorize_tiktok.py</code> is waiting.<br>
    Bu kodu <code>authorize_tiktok.py</code> betiğinin beklediği terminale yapıştırın.
  </div>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const code = p.get("code");
  const err  = p.get("error") || p.get("error_description");
  const kutu = document.getElementById("code");
  const bas  = document.getElementById("baslik");
  const acik = document.getElementById("aciklama");

  if (code) {
    bas.textContent = "Authorization successful";
    bas.className = "ok";
    acik.textContent = "Yetkilendirme başarılı. Aşağıdaki kodu kopyalayın.";
    kutu.textContent = code;
    const btn = document.getElementById("kopyala");
    btn.hidden = false;
    document.getElementById("hint").hidden = false;
    btn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(code);
        btn.textContent = "Copied ✓";
      } catch (e) {
        // Panoya erişim engelliyse kullanıcı elle seçebilsin
        const r = document.createRange();
        r.selectNodeContents(kutu);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        btn.textContent = "Select manually / Elle seçin";
      }
    };
  } else {
    bas.textContent = "Authorization failed";
    bas.className = "err";
    acik.textContent = "Yetkilendirme tamamlanmadı.";
    kutu.textContent = err || "No code returned. / Kod dönmedi.";
  }
</script>
</body>
</html>
